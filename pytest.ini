[pytest]
testpaths = tests
pythonpath = .
# These tests download real nflverse data (cached by nflreadpy after the first
# run) and fit models; a full run takes a few minutes.
# nicegui.testing.user_plugin provides the `user` fixture for the app smoke test.
addopts = -ra -p nicegui.testing.user_plugin
asyncio_mode = auto
main_file = webapp/main.py
